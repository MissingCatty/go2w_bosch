map_server:
  ros__parameters:
    use_sim_time: false
    frame_id: nav_map
    topic_name: map
    yaml_filename: /root/go2_slam_ws/maps/navigation/map_20260811_155640_273_nav.yaml

go2_nav2_odom_qos_bridge:
  ros__parameters:
    use_sim_time: false
    input_topic: /scan_planner/body_pose
    output_topic: /go2/nav2/odom
    stale_timeout: 0.5

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerLattice
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      motion_model_for_search: STATE_LATTICE
      angle_quantization_bins: 16
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.50
      reverse_penalty: 2.0
      change_penalty: 0.20
      non_straight_penalty: 1.15
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      allow_reverse_expansion: true
      smooth_path: false
      lattice_filepath: /opt/ros/humble/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    odom_topic: /go2/nav2/odom
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 8.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.20
      # Web goals intentionally contain no requested final heading.
      yaw_goal_tolerance: 3.14
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 48
      model_dt: 0.05
      batch_size: 1000
      vx_std: 0.18
      vy_std: 0.0
      wz_std: 0.35
      vx_max: 0.50
      vx_min: -0.20
      vy_max: 0.0
      wz_max: 0.45
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.20
      temperature: 0.30
      gamma: 0.015
      motion_model: DiffDrive
      visualize: false
      regenerate_noises: false
      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.2
        mode: 2
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.25
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[[-0.31,-0.18],[0.31,-0.18],[0.31,0.18],[-0.31,0.18]]"
      footprint_padding: 0.02
      always_send_full_costmap: true
      plugins: [voxel_layer, inflation_layer]
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: false
        origin_z: -1.0
        z_resolution: 0.10
        # Humble's compact voxel grid stores at most 16 vertical cells.
        z_voxels: 16
        max_obstacle_height: 1.0
        mark_threshold: 0
        unknown_threshold: 15
        observation_sources: lidar
        lidar:
          # Use SCAN's time-aligned, filtered cloud for costmap integration.
          # The independent Collision Monitor below retains the raw XT16 scan.
          topic: /scan_planner/local_cloud
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: -0.20
          max_obstacle_height: 0.80
          obstacle_min_range: 0.18
          obstacle_max_range: 4.0
          raytrace_min_range: 0.18
          raytrace_max_range: 5.5
          observation_persistence: 0.15
          expected_update_rate: 0.35
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.48
        cost_scaling_factor: 5.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: nav_map
      robot_base_frame: base_link
      transform_tolerance: 0.30
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[-0.31,-0.18],[0.31,-0.18],[0.31,0.18],[-0.31,0.18]]"
      footprint_padding: 0.02
      always_send_full_costmap: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: lidar
        lidar:
          topic: /scan_planner/local_cloud
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: -0.20
          max_obstacle_height: 0.80
          obstacle_min_range: 0.18
          obstacle_max_range: 4.0
          raytrace_min_range: 0.18
          raytrace_max_range: 5.5
          observation_persistence: 0.15
          expected_update_rate: 0.35
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.48
        cost_scaling_factor: 5.0

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.20
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.35
    min_rotational_vel: 0.12
    rotational_acc_lim: 0.60

