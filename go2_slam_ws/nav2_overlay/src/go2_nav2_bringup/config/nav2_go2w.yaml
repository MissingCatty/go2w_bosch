velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: CLOSED_LOOP
    max_velocity: [0.50, 0.0, 0.45]
    min_velocity: [-0.20, 0.0, -0.45]
    max_accel: [0.60, 0.0, 0.60]
    max_decel: [-1.50, 0.0, -1.20]
    odom_topic: /go2/nav2/odom
    odom_duration: 0.10
    deadband_velocity: [0.015, 0.0, 0.015]
    velocity_timeout: 0.30

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /go2/nav2/cmd_vel_smoothed
    cmd_vel_out_topic: /go2/nav2/cmd_vel_safe
    transform_tolerance: 0.20
    # The fused cloud is self/ground filtered and follows the 5-10 Hz LIO
    # cadence, which can occasionally leave a 0.45 s inter-frame gap.
    source_timeout: 0.75
    base_shift_correction: true
    stop_pub_timeout: 0.50
    polygons: [PolygonStop, PolygonSlow, FootprintApproach]
    PolygonStop:
      type: polygon
      points: [0.48, 0.27, 0.48, -0.27, -0.38, -0.27, -0.38, 0.27]
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: /go2/nav2/collision_stop_zone
      enabled: true
    PolygonSlow:
      type: polygon
      points: [0.90, 0.45, 0.90, -0.45, -0.60, -0.45, -0.60, 0.45]
      action_type: slowdown
      max_points: 3
      slowdown_ratio: 0.30
      visualize: true
      polygon_pub_topic: /go2/nav2/collision_slow_zone
      enabled: true
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.5
      simulation_time_step: 0.05
      max_points: 3
      visualize: false
      enabled: true
    observation_sources: [pointcloud]
    pointcloud:
      type: pointcloud
      # Raw XT16 scans contain persistent returns from the GO2-W body inside
      # PolygonStop. Reuse SCAN's near-field self/ground-filtered cloud so the
      # collision layer does not interpret the robot itself as an obstacle.
      topic: /scan_planner/local_cloud
      min_height: -0.20
      max_height: 0.80
      enabled: true
